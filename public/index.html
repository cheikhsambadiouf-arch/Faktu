<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Faktu — Gestion commerciale</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
#splash{
  position:relative;
  width:min(100vw, calc(100vh * 736 / 1308));
  height:min(100vh, calc(100vw * 1308 / 736));
  aspect-ratio:736/1308;
  flex:0 0 auto;
  overflow:hidden;
  background:url('/faktu-start-reference.png') center center / 100% 100% no-repeat;
}
.hit{
  position:absolute;
  display:block;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* Zones interactives exactement superposées aux boutons du visuel */
#start{left:8.7%;top:71.9%;width:82.6%;height:5.9%;border-radius:999px}
#login{left:8.7%;top:78.9%;width:82.6%;height:5.7%;border-radius:999px}

/* Les quatre blocs peuvent être touchés sans modifier le visuel */
#sell{left:4%;top:35.0%;width:23%;height:12%;border-radius:22px}
#invoice{left:70%;top:35.0%;width:25%;height:12%;border-radius:22px}
#collect{left:4%;top:49.3%;width:23%;height:12%;border-radius:22px}
#delivery{left:70%;top:49.3%;width:25%;height:12%;border-radius:22px}

/* Langues */
#lang-fr{left:8%;top:89.3%;width:25%;height:5.8%}
#lang-en{left:37%;top:89.3%;width:25%;height:5.8%}
#lang-ar{left:66%;top:89.3%;width:26%;height:5.8%}
</style>
</head>
<body>
<main id="splash" aria-label="Écran de démarrage Faktu">
  <button id="start" class="hit" aria-label="Commencer"
    onclick="window.location.href='/dashboard.html'"></button>
  <button id="login" class="hit" aria-label="J’ai déjà un compte"
    onclick="window.location.href='/dashboard.html'"></button>

  <button id="sell" class="hit" aria-label="Vendez facilement"
    onclick="window.location.href='/dashboard.html'"></button>
  <button id="invoice" class="hit" aria-label="Facturez en un clic"
    onclick="window.location.href='/dashboard.html'"></button>
  <button id="collect" class="hit" aria-label="Encaissez rapidement"
    onclick="window.location.href='/dashboard.html'"></button>
  <button id="delivery" class="hit" aria-label="Livrez sans stress"
    onclick="window.location.href='/dashboard.html'"></button>

  <button id="lang-fr" class="hit" aria-label="Français"></button>
  <button id="lang-en" class="hit" aria-label="English"></button>
  <button id="lang-ar" class="hit" aria-label="العربية"></button>
</main>
<script src="/app.js?v=12"></script>
</body>
</html>
